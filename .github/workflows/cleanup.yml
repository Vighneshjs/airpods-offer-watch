name: Remove AirPods watch
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup.yml]
permissions:
  contents: write
  actions: write
  pages: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      EXPECTED_REPOSITORY: Vighneshjs/airpods-offer-watch
    steps:
      - name: Remove saved state, publication and previous runs
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          repo = os.environ['EXPECTED_REPOSITORY']
          if repo not in {'Vighneshjs/airpods-price-monitor','Vighneshjs/airpods-offer-watch'} or os.environ['GITHUB_REPOSITORY'] != repo:
              raise SystemExit('Cleanup repository mismatch.')
          own = int(os.environ['GITHUB_RUN_ID'])
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          opener = urllib.request.build_opener(NoRedirect)
          def api(method, path, allow_missing=False):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path, method=method, headers={'Authorization':'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with opener.open(request, timeout=20) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  if allow_missing and error.code == 404: return None
                  raise SystemExit('Cleanup API request failed with HTTP ' + str(error.code) + ' for ' + path)
          runs = api('GET', '/actions/runs?per_page=100').get('workflow_runs', [])
          for run in runs:
              if run['id'] != own and run['status'] in {'queued','in_progress','waiting','requested','pending'}:
                  api('POST', '/actions/runs/' + str(run['id']) + '/cancel', True)
          print('Other workflow runs stopped.')
          if repo.endswith('/airpods-price-monitor'):
              api('DELETE', '/git/refs/heads/monitor-state', True)
              print('Private monitor-state branch removed.')
          else:
              api('DELETE', '/pages', True)
              print('GitHub Pages publication removed.')
          for run in runs:
              if run['id'] != own and run['status'] == 'completed':
                  api('DELETE', '/actions/runs/' + str(run['id']), True)
          print('Previous completed workflow runs, logs and artifacts removed.')
          PY
